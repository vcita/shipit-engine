name: CI

on: [push, pull_request]

env:
  # libv8 and mini_racer only compile assets; the runner's Node.js serves ExecJS.
  BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
  BUNDLE_WITHOUT: ci

jobs:
  lint:
    name: Lint Ruby
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Write Gemfile.ci
      run: |
        grep -v -E "gem '(libv8|mini_racer)'" Gemfile > Gemfile.ci
        cp Gemfile.lock Gemfile.ci.lock
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'
        bundler: '2.1.4'
        bundler-cache: true
    - name: rubocop on the changed files
      run: |
        files=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- '*.rb' | grep -v -E '^(test/dummy|db|vendor|bin)/' || true)
        if [ -z "$files" ]; then echo "No Ruby files changed."; exit 0; fi
        bundle exec rubocop $files

  sqlite:
    name: Tests with SQLite3
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis
        ports:
        - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Write Gemfile.ci
      run: |
        grep -v -E "gem '(libv8|mini_racer)'" Gemfile > Gemfile.ci
        cp Gemfile.lock Gemfile.ci.lock
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'
        bundler: '2.1.4'
        bundler-cache: true
    - name: Run tests
      env:
        RAILS_ENV: test
      run: |
        cd test/dummy
        bundle exec rake db:create db:schema:load
        cd ../..
        bundle exec rake test
