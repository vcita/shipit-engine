name: CI

on: [push, pull_request]

env:
  # libv8 and mini_racer only compile assets; Node.js serves ExecJS.
  BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
  BUNDLE_WITHOUT: ci
  BUNDLE_PATH: vendor/bundle

jobs:
  lint:
    name: Lint Ruby
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # nokogiri 1.10 does not build on glibc 2.35+ (Ubuntu 22.04 and later); bullseye has 2.31.
    container: ruby:2.7-bullseye

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Write Gemfile.ci
      run: |
        grep -v -E "gem '(libv8|mini_racer)'" Gemfile > Gemfile.ci
        cp Gemfile.lock Gemfile.ci.lock
    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bullseye-ruby-2.7-gems-${{ hashFiles('Gemfile.lock', 'shipit-engine.gemspec') }}
    # Not frozen: Gemfile.ci.lock still lists the two gems that Gemfile.ci leaves out.
    - run: |
        gem install bundler -v 2.1.4 --no-document
        bundle _2.1.4_ install --jobs 4 --retry 3
    # Only offenses on lines this pull request adds: many files still have old offenses.
    - name: rubocop on the added lines
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git diff -U0 --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- '*.rb' \
          ':!test/dummy' ':!db' ':!vendor' ':!bin' \
          | awk '/^\+\+\+ b\//{f=substr($2,3)} /^@@/{split($3,a,","); s=substr(a[1],2); n=(a[2]==""?1:a[2]); for(i=s;i<s+n;i++) print f":"i}' \
          > added-lines.txt
        files=$(cut -d: -f1 added-lines.txt | sort -u)
        if [ -z "$files" ]; then echo "No Ruby lines added."; exit 0; fi
        bundle _2.1.4_ exec rubocop --format emacs $files | sed "s#^$PWD/##" > offenses.txt || true
        awk -F: 'NR==FNR{added[$1":"$2]=1; next} added[$1":"$2]' added-lines.txt offenses.txt > new-offenses.txt
        cat new-offenses.txt
        test ! -s new-offenses.txt

  sqlite:
    name: Tests with SQLite3
    runs-on: ubuntu-latest
    container: ruby:2.7-bullseye

    services:
      redis:
        image: redis

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Write Gemfile.ci
      run: |
        grep -v -E "gem '(libv8|mini_racer)'" Gemfile > Gemfile.ci
        cp Gemfile.lock Gemfile.ci.lock
    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bullseye-ruby-2.7-gems-${{ hashFiles('Gemfile.lock', 'shipit-engine.gemspec') }}
    - run: |
        gem install bundler -v 2.1.4 --no-document
        bundle _2.1.4_ install --jobs 4 --retry 3
    - name: Run tests
      env:
        RAILS_ENV: test
        REDIS_URL: redis://redis:6379/7
      run: |
        cd test/dummy
        bundle _2.1.4_ exec rake db:create db:schema:load
        cd ../..
        bundle _2.1.4_ exec rake test
